<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Water Drone Prototype</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Segoe UI", sans-serif;
        color: #fff;
      }
      #dashboard {
        position: absolute;
        top: 30px;
        right: 30px;
        width: 320px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 25px;
        border-radius: 20px;
        backdrop-filter: blur(25px);
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        pointer-events: none;
        z-index: 100;
      }
      .header {
        font-size: 16px;
        font-weight: 300;
        color: #fff;
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 10px;
      }
      .telemetry {
        display: flex;
        justify-content: space-between;
        margin: 10px 0;
        font-size: 11px;
        letter-spacing: 1px;
      }
      .label {
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
      }
      .val {
        color: #00d4ff;
        font-family: "Courier New", monospace;
        font-weight: bold;
      }
      .status-active {
        color: #00ffcc;
        text-shadow: 0 0 10px #00ffcc;
      }
      #control-hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.05);
        padding: 12px 30px;
        border-radius: 50px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      kbd {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 3px 8px;
        color: #fff;
        margin: 0 3px;
      }
    </style>
  </head>
  <body>
    <div id="dashboard">
      <div class="header">
        Kandyba-X1 <span style="font-weight: 800; color: #00d4ff">LUX</span>
      </div>
      <div class="telemetry">
        <span class="label">Sistem Propulsi:</span>
        <span class="status-active">OPTIMAL</span>
      </div>
      <div class="telemetry">
        <span class="label">Ketinggian:</span>
        <span class="val" id="alt">0.00 m</span>
      </div>
      <div class="telemetry">
        <span class="label">Output Thrust:</span>
        <span class="val" id="lift">0.0 N</span>
      </div>
      <div class="telemetry">
        <span class="label">Mode Kendali:</span>
        <span class="val" id="input-status">STANDBY</span>
      </div>
      <div
        style="
          margin-top: 20px;
          height: 2px;
          background: linear-gradient(90deg, #00d4ff, transparent);
        "
      ></div>
      <p
        style="
          font-size: 9px;
          color: rgba(255, 255, 255, 0.3);
          margin-top: 15px;
          line-height: 1.6;
        "
      >
        Prototipe eksklusif dengan teknologi resonansi asimetris. Didesain untuk
        operasional senyap di lingkungan industri tingkat tinggi.
      </p>
    </div>

    <div id="control-hint">
      Navigasi: <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> | Elevasi:
      <kbd>▲</kbd><kbd>▼</kbd> | Rotasi: <kbd>◄</kbd><kbd>►</kbd>
    </div>

    <script>
      let scene, camera, renderer, drone, clock, floor;
      let vortexRings = [];
      let time = 0;
      const keys = {};
      const droneVelocity = new THREE.Vector3();
      let droneRotationY = 0;

      function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020305);
        scene.fog = new THREE.FogExp2(0x020305, 0.015);

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          1000,
        );
        camera.position.set(0, 12, 28);

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // --- LIGHTING REALISTIS ---
        const sunLight = new THREE.SpotLight(0xffffff, 1.5);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        scene.add(sunLight);

        const rimLight = new THREE.PointLight(0x00d4ff, 2, 50);
        rimLight.position.set(-15, 5, -15);
        scene.add(rimLight);

        const ambient = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambient);

        // --- LANTAI REFLEKTIF (HANGAR) ---
        const floorGeom = new THREE.PlaneGeometry(1000, 1000);
        const floorMat = new THREE.MeshStandardMaterial({
          color: 0x050505,
          roughness: 0.1,
          metalness: 0.8,
        });
        floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -10;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(200, 60, 0x111111, 0x080808);
        grid.position.y = -9.95;
        scene.add(grid);

        // --- KONSTRUKSI DRONE LUX (PUTIH MUTIARA) ---
        drone = new THREE.Group();
        scene.add(drone);

        const pearlMat = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          metalness: 0.3,
          roughness: 0.1,
          envMapIntensity: 1,
        });
        const chromeMat = new THREE.MeshStandardMaterial({
          color: 0x222222,
          metalness: 1,
          roughness: 0.05,
        });
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff });

        // Frame Berbentuk Aerodinamis
        const armGeom = new THREE.CylinderGeometry(0.15, 0.15, 11, 16);
        const arm1 = new THREE.Mesh(armGeom, chromeMat);
        arm1.rotation.z = Math.PI / 2;
        arm1.rotation.y = Math.PI / 4;
        drone.add(arm1);

        const arm2 = new THREE.Mesh(armGeom, chromeMat);
        arm2.rotation.z = Math.PI / 2;
        arm2.rotation.y = -Math.PI / 4;
        drone.add(arm2);

        // Body Pusat Elegan
        const bodyTop = new THREE.Mesh(
          new THREE.SphereGeometry(
            1.5,
            32,
            16,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2.2,
          ),
          pearlMat,
        );
        bodyTop.scale.y = 0.4;
        bodyTop.position.y = 0.2;
        bodyTop.castShadow = true;
        drone.add(bodyTop);

        const bodyBottom = new THREE.Mesh(
          new THREE.CylinderGeometry(1.5, 0.8, 0.6, 32),
          chromeMat,
        );
        bodyBottom.position.y = -0.2;
        drone.add(bodyBottom);

        // LED Ring Pusat
        const ledRing = new THREE.Mesh(
          new THREE.TorusGeometry(1.51, 0.05, 16, 100),
          glowMat,
        );
        ledRing.rotation.x = Math.PI / 2;
        drone.add(ledRing);

        // Thruster Units
        const thrusterPositions = [
          { x: 3.8, z: 3.8 },
          { x: -3.8, z: 3.8 },
          { x: 3.8, z: -3.8 },
          { x: -3.8, z: -3.8 },
        ];

        thrusterPositions.forEach((pos, index) => {
          const unit = createThrusterUnit(pearlMat, chromeMat);
          unit.position.set(pos.x, 0, pos.z);
          unit.name = "thruster_" + index;
          unit.castShadow = true;
          drone.add(unit);
        });

        window.addEventListener("keydown", (e) => (keys[e.code] = true));
        window.addEventListener("keyup", (e) => (keys[e.code] = false));

        clock = new THREE.Clock();
        animate();
      }

      function createThrusterUnit(pMat, cMat) {
        const unit = new THREE.Group();
        const ring = new THREE.Mesh(
          new THREE.TorusGeometry(1.3, 0.2, 16, 64),
          pMat,
        );
        ring.rotation.x = Math.PI / 2;
        unit.add(ring);

        const core = new THREE.Mesh(
          new THREE.SphereGeometry(0.35, 16, 16),
          new THREE.MeshStandardMaterial({
            color: 0x00d4ff,
            emissive: 0x00d4ff,
            emissiveIntensity: 2,
          }),
        );
        unit.add(core);

        const shield = new THREE.Mesh(
          new THREE.CylinderGeometry(1.1, 1.1, 0.4, 32, 1, true),
          cMat,
        );
        unit.add(shield);

        return unit;
      }

      function createVortexRing(pos) {
        const rGeom = new THREE.TorusGeometry(0.9, 0.02, 8, 32);
        const rMat = new THREE.MeshBasicMaterial({
          color: 0x00d4ff,
          transparent: true,
          opacity: 0.4,
        });
        const ring = new THREE.Mesh(rGeom, rMat);
        ring.position.set(pos.x, pos.y - 0.5, pos.z);
        ring.rotation.x = Math.PI / 2;
        scene.add(ring);
        vortexRings.push({ mesh: ring, scale: 1, opacity: 0.4 });
      }

      function handleInput() {
        let inputStr = "IDLE";
        const moveSpeed = 0.2;
        const rotateSpeed = 0.035;

        if (keys["ArrowUp"]) {
          droneVelocity.y += 0.015;
          inputStr = "ASCENDING";
        }
        if (keys["ArrowDown"]) {
          droneVelocity.y -= 0.015;
          inputStr = "DESCENDING";
        }

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          droneRotationY,
        );
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          droneRotationY,
        );

        if (keys["KeyW"]) {
          drone.position.add(forward.multiplyScalar(moveSpeed));
          inputStr = "FORWARD";
        }
        if (keys["KeyS"]) {
          drone.position.add(forward.multiplyScalar(-moveSpeed));
          inputStr = "BACKWARD";
        }
        if (keys["KeyA"]) {
          drone.position.add(right.multiplyScalar(-moveSpeed));
          inputStr = "STRAFE LEFT";
        }
        if (keys["KeyD"]) {
          drone.position.add(right.multiplyScalar(moveSpeed));
          inputStr = "STRAFE RIGHT";
        }

        if (keys["ArrowLeft"]) {
          droneRotationY += rotateSpeed;
          inputStr = "ROTATING LEFT";
        }
        if (keys["ArrowRight"]) {
          droneRotationY -= rotateSpeed;
          inputStr = "ROTATING RIGHT";
        }

        drone.position.y += droneVelocity.y;
        droneVelocity.y *= 0.96;
        if (drone.position.y < -8.5) {
          drone.position.y = -8.5;
          droneVelocity.y = 0;
        }

        drone.rotation.y = droneRotationY;

        // Tilt Dynamics
        let targetTX = 0,
          targetTZ = 0;
        if (keys["KeyW"]) targetTX = 0.25;
        if (keys["KeyS"]) targetTX = -0.25;
        if (keys["KeyA"]) targetTZ = 0.25;
        if (keys["KeyD"]) targetTZ = -0.25;

        drone.rotation.x += (targetTX - drone.rotation.x) * 0.1;
        drone.rotation.z += (targetTZ - drone.rotation.z) * 0.1;

        document.getElementById("input-status").innerText = inputStr;
      }

      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        time += delta;

        handleInput();

        const cycle = (time * 10) % 1;
        const isJerk = cycle < 0.2;

        // Thruster Pulse Animation
        drone.children.forEach((child) => {
          if (child.name && child.name.startsWith("thruster")) {
            const core = child.children[1];
            if (isJerk) {
              child.position.y = -0.1;
              core.material.emissiveIntensity = 10;
              if (Math.random() > 0.5 && drone.position.y > -8.5) {
                const worldPos = new THREE.Vector3();
                child.getWorldPosition(worldPos);
                createVortexRing(worldPos);
              }
            } else {
              child.position.y = 0;
              core.material.emissiveIntensity = 1.5;
            }
          }
        });

        // Vortex Physics
        for (let i = vortexRings.length - 1; i >= 0; i--) {
          const v = vortexRings[i];
          v.mesh.position.y -= 0.25;
          v.scale += 0.05;
          v.opacity -= 0.02;
          v.mesh.scale.set(v.scale, v.scale, v.scale);
          v.mesh.material.opacity = v.opacity;
          if (v.opacity <= 0) {
            scene.remove(v.mesh);
            vortexRings.splice(i, 1);
          }
        }

        // UI Update
        document.getElementById("alt").innerText =
          (drone.position.y + 8.5).toFixed(2) + " m";
        document.getElementById("lift").innerText =
          (isJerk ? 740.0 : 50.5).toFixed(1) + " N";

        // Cinematic Camera
        const camOffset = new THREE.Vector3(0, 6, 20).applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          droneRotationY,
        );
        const targetCamPos = drone.position.clone().add(camOffset);
        camera.position.lerp(targetCamPos, 0.08);
        camera.lookAt(drone.position.clone().add(new THREE.Vector3(0, -1, 0)));

        renderer.render(scene, camera);
      }

      window.onload = init;
      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
