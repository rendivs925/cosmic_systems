<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UAP: Swiss Alpine Realism (Wider, No Clouds)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #a5c9e1;
        font-family: "Inter", sans-serif;
        color: #111;
      }
      #ui {
        position: absolute;
        top: 30px;
        left: 30px;
        background: rgba(255, 255, 255, 0.4);
        padding: 20px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        backdrop-filter: blur(15px);
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.05);
      }
      .brand {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 3px;
        color: #1a1a1a;
        margin-bottom: 15px;
        text-transform: uppercase;
      }
      .data-row {
        display: flex;
        justify-content: space-between;
        font-size: 9px;
        margin: 8px 0;
        color: rgba(0, 0, 0, 0.6);
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }
      .val {
        color: #000;
        font-family: monospace;
        font-weight: bold;
      }
      #controls-hint {
        position: absolute;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.5);
        padding: 8px 25px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        font-size: 9px;
        color: rgba(0, 0, 0, 0.7);
        text-align: center;
        letter-spacing: 2px;
        backdrop-filter: blur(10px);
        z-index: 100;
        border-radius: 4px;
      }
      #audio-prompt {
        position: fixed;
        inset: 0;
        background: #eef2f3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 200;
        cursor: pointer;
      }
      #audio-prompt h2 {
        color: #1a1a1a;
        letter-spacing: 10px;
        font-weight: 200;
        margin-bottom: 10px;
      }
      #audio-prompt p {
        font-size: 10px;
        color: #4b7bec;
        letter-spacing: 3px;
      }
    </style>
  </head>

  <body>
    <div id="audio-prompt" onclick="startEngine()">
      <h2>SYNCHRONIZE</h2>
      <p>ALPINE FLIGHT PROTOCOL</p>
    </div>

    <div id="ui">
      <div class="brand">UAP <b>MODEL-S</b></div>
      <div class="data-row">
        <span>LOCATION:</span><span class="val">SWITZERLAND</span>
      </div>
      <div class="data-row">
        <span>ALTITUDE:</span> <span class="val" id="depth">2,100 m</span>
      </div>
      <div class="data-row">
        <span>VIEW MODE:</span> <span class="val" id="view-mode">FOLLOW</span>
      </div>
    </div>

    <div id="controls-hint">
      WASD to Move | Arrows to Rotate | [V] Toggle Human POV
    </div>

    <script>
      let scene, camera, renderer, drone, clock;
      let keys = {};
      let time = 0;
      let velocity = new THREE.Vector3();
      let rotationY = 0;
      let verticalVelocity = 0;
      let isHumanView = false;

      // Human POV anchor (XZ only); Y will be sampled from terrain each frame
      let humanAnchorXZ = new THREE.Vector3(20, 0, 40);

      // Audio
      let audioCtx, mainGain, panner, engineOsc, engineGain, phaserFilter;

      // World
      let terrainMesh = null;
      let terrainRay = new THREE.Raycaster();
      let distantMountains = null;

      function startEngine() {
        if (audioCtx) return;

        document.getElementById("audio-prompt").style.opacity = "0";
        setTimeout(
          () => document.getElementById("audio-prompt").remove(),
          1000,
        );

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        panner = audioCtx.createStereoPanner();
        mainGain = audioCtx.createGain();
        mainGain.connect(audioCtx.destination);
        panner.connect(mainGain);

        // Brown noise
        const bufferSize = 2 * audioCtx.sampleRate;
        const noiseBuffer = audioCtx.createBuffer(
          1,
          bufferSize,
          audioCtx.sampleRate,
        );
        const output = noiseBuffer.getChannelData(0);
        let lastOut = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          output[i] = (lastOut + 0.01 * white) / 1.01;
          lastOut = output[i];
          output[i] *= 4;
        }
        const noiseSource = audioCtx.createBufferSource();
        noiseSource.buffer = noiseBuffer;
        noiseSource.loop = true;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 55;

        phaserFilter = audioCtx.createBiquadFilter();
        phaserFilter.type = "allpass";
        phaserFilter.frequency.value = 520;

        noiseSource.connect(filter);
        filter.connect(phaserFilter);
        phaserFilter.connect(panner);
        noiseSource.start();

        engineOsc = audioCtx.createOscillator();
        engineOsc.type = "sine";
        engineOsc.frequency.value = 38;

        engineGain = audioCtx.createGain();
        engineGain.gain.value = 0.08;

        engineOsc.connect(engineGain);
        engineGain.connect(panner);
        engineOsc.start();

        init();
      }

      // ---- Utilities ----
      function clamp(x, a, b) {
        return Math.max(a, Math.min(b, x));
      }
      function smoothstep(a, b, x) {
        x = clamp((x - a) / (b - a), 0, 1);
        return x * x * (3 - 2 * x);
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      // Quick procedural height (used both for mesh displacement and for mountains)
      function heightField(x, z) {
        // Big forms
        let h =
          Math.sin(x * 0.00022) * 1050 +
          Math.cos(z * 0.00022) * 1050 +
          Math.sin((x + z) * 0.00016) * 780;

        // Ridges
        h += Math.sin(x * 0.0009) * 260 + Math.cos(z * 0.0009) * 260;

        // Micro detail
        h += Math.sin(x * 0.0061) * 22 + Math.cos(z * 0.0067) * 22;
        h += Math.sin((x + z) * 0.0042) * 18;

        return h;
      }

      function sampleTerrainHeight(x, z) {
        if (!terrainMesh) return -360;
        terrainRay.set(
          new THREE.Vector3(x, 8000, z),
          new THREE.Vector3(0, -1, 0),
        );
        const hits = terrainRay.intersectObject(terrainMesh, false);
        return hits.length ? hits[0].point.y : -360;
      }

      function init() {
        scene = new THREE.Scene();

        // Wider view distance + better atmosphere
        scene.fog = new THREE.Fog(0xcfe6f7, 3000, 38000);

        camera = new THREE.PerspectiveCamera(
          50,
          window.innerWidth / window.innerHeight,
          0.1,
          80000,
        );

        renderer = new THREE.WebGLRenderer({
          antialias: true,
          logarithmicDepthBuffer: true,
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        renderer.physicallyCorrectLights = true;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        document.body.appendChild(renderer.domElement);

        // Sky gradient dome
        const skyGeo = new THREE.SphereGeometry(60000, 48, 24);
        const skyMat = new THREE.ShaderMaterial({
          side: THREE.BackSide,
          uniforms: {
            topColor: { value: new THREE.Color(0x5ea8ff) },
            bottomColor: { value: new THREE.Color(0xeaf8ff) },
            offset: { value: 1200 },
            exponent: { value: 0.55 },
          },
          vertexShader: `
            varying vec3 vWorldPosition;
            void main() {
              vec4 worldPosition = modelMatrix * vec4(position, 1.0);
              vWorldPosition = worldPosition.xyz;
              gl_Position = projectionMatrix * viewMatrix * worldPosition;
            }
          `,
          fragmentShader: `
            uniform vec3 topColor;
            uniform vec3 bottomColor;
            uniform float offset;
            uniform float exponent;
            varying vec3 vWorldPosition;
            void main() {
              float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y;
              float t = pow(max(h, 0.0), exponent);
              gl_FragColor = vec4(mix(bottomColor, topColor, t), 1.0);
            }
          `,
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));

        // Lighting
        const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x2f3a22, 0.65);
        scene.add(hemi);

        const sun = new THREE.DirectionalLight(0xfff1d8, 2.4);
        sun.position.set(14000, 12000, 9000);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 1;
        sun.shadow.camera.far = 50000;
        sun.shadow.camera.left = -9000;
        sun.shadow.camera.right = 9000;
        sun.shadow.camera.top = 9000;
        sun.shadow.camera.bottom = -9000;
        scene.add(sun);

        // --------- TERRAIN (WIDER) ----------
        const SIZE = 45000; // wider environment
        const SEG = 320; // keep it reasonable for performance
        const baseY = -900; // push down so horizon feels correct

        const groundGeom = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
        groundGeom.rotateX(-Math.PI / 2);

        // Displace + colorize
        const pos = groundGeom.attributes.position;
        const colors = new Float32Array(pos.count * 3);
        const color = new THREE.Color();

        for (let i = 0; i < pos.count; i++) {
          const x = pos.getX(i);
          const z = pos.getZ(i);

          // Realistic-ish alpine amplitude
          const h = heightField(x, z);

          // Add valley shaping
          const valley = Math.sin((x + z) * 0.00006) * 220;

          const y = baseY + h * 0.55 + valley;
          pos.setY(i, y);
        }
        groundGeom.computeVertexNormals();

        // Vertex colors based on height + slope (works with PBR lighting!)
        for (let i = 0; i < pos.count; i++) {
          const y = pos.getY(i);

          // slope approx from normal.y (flat=1, cliff=0)
          const ny = groundGeom.attributes.normal.getY(i);
          const slope = clamp(ny, 0, 1);

          // Base albedo colors
          const meadow = new THREE.Color(0x2f6b3a);
          const rock = new THREE.Color(0x6b737b);
          const snow = new THREE.Color(0xf3f7ff);

          // Rock on steep slopes
          let rockMask = 1 - slope;
          rockMask = smoothstep(0.18, 0.78, rockMask);

          // Snowline
          const snowLine = baseY + 900; // adjust
          let snowMask = smoothstep(snowLine, snowLine + 650, y);
          snowMask *= smoothstep(0.12, 0.88, slope); // less snow on cliffs

          // Small color variation (patchy grass)
          const x = pos.getX(i);
          const z = pos.getZ(i);
          const varN =
            (Math.sin(x * 0.0021) +
              Math.cos(z * 0.0023) +
              Math.sin((x + z) * 0.0017)) *
            0.33;
          const grassTint = clamp(0.9 + varN * 0.08, 0.82, 1.02);

          // Blend
          color.copy(meadow).multiplyScalar(grassTint);
          color.lerp(rock, rockMask);
          color.lerp(snow, snowMask);

          // Slight darkening in valleys
          const valleyShade = clamp(0.92 + (y - baseY) / 3000, 0.86, 1.05);
          color.multiplyScalar(valleyShade);

          colors[i * 3 + 0] = color.r;
          colors[i * 3 + 1] = color.g;
          colors[i * 3 + 2] = color.b;
        }

        groundGeom.setAttribute("color", new THREE.BufferAttribute(colors, 3));

        const terrainMat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 0.98,
          metalness: 0.0,
        });

        terrainMesh = new THREE.Mesh(groundGeom, terrainMat);
        terrainMesh.receiveShadow = true;
        scene.add(terrainMesh);

        // --------- DISTANT MOUNTAIN RING (makes horizon look real) ----------
        const ringGroup = new THREE.Group();
        scene.add(ringGroup);

        function addRidge(radius, heightMul, yOffset, tintHex) {
          const ridgeGeo = new THREE.CylinderGeometry(
            radius * 1.02,
            radius,
            2200,
            96,
            1,
            true,
          );
          // Deform top edge by pushing vertices up/down
          const p = ridgeGeo.attributes.position;
          for (let i = 0; i < p.count; i++) {
            const vx = p.getX(i);
            const vy = p.getY(i);
            const vz = p.getZ(i);
            // only near top edge
            if (vy > 900) {
              const n = heightField(vx * 0.7, vz * 0.7) * 0.25;
              p.setY(i, vy + n * heightMul);
            }
          }
          ridgeGeo.computeVertexNormals();

          const m = new THREE.Mesh(
            ridgeGeo,
            new THREE.MeshStandardMaterial({
              color: tintHex,
              roughness: 1.0,
              metalness: 0.0,
            }),
          );
          m.position.y = yOffset;
          m.castShadow = false;
          m.receiveShadow = false;
          ringGroup.add(m);
        }

        // layered ridges for depth (wider + more natural)
        addRidge(19000, 0.9, baseY + 900, 0x7f8c95);
        addRidge(25000, 1.1, baseY + 1200, 0x8c99a3);
        addRidge(32000, 1.25, baseY + 1450, 0x98a6b0);

        // --------- TREES (optional, light scatter) ----------
        const trunkGeo = new THREE.CylinderGeometry(0.35, 0.55, 6, 6);
        const leafGeo = new THREE.ConeGeometry(2.6, 10, 8);
        const trunkMat = new THREE.MeshStandardMaterial({
          color: 0x4b3621,
          roughness: 1,
        });
        const leafMat = new THREE.MeshStandardMaterial({
          color: 0x1f5a2f,
          roughness: 1,
        });

        const treeCount = 550;
        const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, treeCount);
        const leaves = new THREE.InstancedMesh(leafGeo, leafMat, treeCount);
        trunks.castShadow = true;
        leaves.castShadow = true;

        const dummy = new THREE.Object3D();
        let placed = 0;

        for (let i = 0; i < treeCount * 2 && placed < treeCount; i++) {
          const x = (Math.random() - 0.5) * (SIZE * 0.78);
          const z = (Math.random() - 0.5) * (SIZE * 0.78);
          const y = sampleTerrainHeight(x, z);

          // avoid high snow zone
          if (y > baseY + 1350) continue;

          // avoid steep slopes (quick check by sampling nearby)
          const y2 = sampleTerrainHeight(x + 18, z);
          const y3 = sampleTerrainHeight(x, z + 18);
          const slopeApprox = Math.abs(y2 - y) + Math.abs(y3 - y);
          if (slopeApprox > 28) continue;

          const s = 0.75 + Math.random() * 1.15;

          dummy.position.set(x, y + 3, z);
          dummy.rotation.y = Math.random() * Math.PI * 2;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          trunks.setMatrixAt(placed, dummy.matrix);

          dummy.position.set(x, y + 9, z);
          dummy.rotation.y = dummy.rotation.y;
          dummy.scale.set(s, s, s);
          dummy.updateMatrix();
          leaves.setMatrixAt(placed, dummy.matrix);

          placed++;
        }

        trunks.count = placed;
        leaves.count = placed;
        trunks.instanceMatrix.needsUpdate = true;
        leaves.instanceMatrix.needsUpdate = true;

        scene.add(trunks);
        scene.add(leaves);

        // --------- UFO ----------
        drone = new THREE.Group();
        scene.add(drone);

        const hullMat = new THREE.MeshStandardMaterial({
          color: 0x95afc0,
          metalness: 1.0,
          roughness: 0.12,
        });

        const sportModel = new THREE.Group();
        drone.add(sportModel);

        const body = new THREE.Mesh(
          new THREE.SphereGeometry(6, 64, 32),
          hullMat,
        );
        body.scale.y = 0.28;
        body.castShadow = true;
        sportModel.add(body);

        const topSlope = new THREE.Mesh(
          new THREE.CylinderGeometry(1.5, 3, 0.8, 64),
          hullMat,
        );
        topSlope.position.y = 0.8;
        topSlope.castShadow = true;
        sportModel.add(topSlope);

        const emitter = new THREE.Mesh(
          new THREE.SphereGeometry(1.2, 32, 32),
          new THREE.MeshBasicMaterial({
            color: 0xc7ecee,
            transparent: true,
            opacity: 0.65,
          }),
        );
        emitter.position.y = -1.1;
        emitter.scale.y = 0.3;
        sportModel.add(emitter);

        // Start on top of terrain (prevents "empty sky / clipped ground" look)
        const startY = sampleTerrainHeight(0, 0) + 40;
        drone.position.set(0, startY, 0);

        // Input
        window.addEventListener("keydown", (e) => {
          keys[e.code] = true;
          if (e.code === "KeyV") {
            isHumanView = !isHumanView;
            document.getElementById("view-mode").innerText = isHumanView
              ? "HUMAN POV"
              : "FOLLOW";
          }
        });
        window.addEventListener("keyup", (e) => (keys[e.code] = false));

        clock = new THREE.Clock();
        animate();
      }

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        time += delta;

        // Physics
        const accel = 0.055;
        const friction = 0.986;
        const rotSpeed = 0.02;

        if (keys["ArrowLeft"]) rotationY += rotSpeed;
        if (keys["ArrowRight"]) rotationY -= rotSpeed;

        const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          rotationY,
        );
        const right = new THREE.Vector3(1, 0, 0).applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          rotationY,
        );

        if (keys["KeyW"]) velocity.add(forward.clone().multiplyScalar(accel));
        if (keys["KeyS"]) velocity.sub(forward.clone().multiplyScalar(accel));
        if (keys["KeyA"]) velocity.sub(right.clone().multiplyScalar(accel));
        if (keys["KeyD"]) velocity.add(right.clone().multiplyScalar(accel));

        if (keys["ArrowUp"]) verticalVelocity += accel;
        if (keys["ArrowDown"]) verticalVelocity -= accel;

        velocity.multiplyScalar(friction);
        verticalVelocity *= friction;

        if (drone) {
          drone.position.add(velocity);
          drone.position.y += verticalVelocity;
          drone.rotation.y = rotationY;

          // Keep above ground
          const groundY = sampleTerrainHeight(
            drone.position.x,
            drone.position.z,
          );
          const minY = groundY + 10;
          if (drone.position.y < minY) {
            drone.position.y = minY;
            verticalVelocity *= 0.2;
          }

          // Tilt
          const localVel = velocity
            .clone()
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), -rotationY);
          drone.rotation.z = THREE.MathUtils.lerp(
            drone.rotation.z,
            -localVel.x * 0.8,
            0.08,
          );
          drone.rotation.x = THREE.MathUtils.lerp(
            drone.rotation.x,
            localVel.z * 0.7,
            0.08,
          );

          // CAMERA
          if (!isHumanView) {
            // Higher + wider follow camera (more horizon, feels realistic)
            const camOffset = new THREE.Vector3(0, 22, 70).applyAxisAngle(
              new THREE.Vector3(0, 1, 0),
              rotationY,
            );
            camera.position.lerp(drone.position.clone().add(camOffset), 0.05);
            camera.lookAt(
              drone.position.clone().add(new THREE.Vector3(0, 4, 0)),
            );
          } else {
            // Human POV: lock XZ, sample Y from terrain for "standing on ground"
            const eyeHeight = 1.7;
            const y =
              sampleTerrainHeight(humanAnchorXZ.x, humanAnchorXZ.z) + eyeHeight;

            const shakeX = Math.sin(time * 2.3) * 0.08;
            const shakeY = Math.cos(time * 2.1) * 0.06;

            camera.position.set(
              humanAnchorXZ.x + shakeX,
              y + shakeY,
              humanAnchorXZ.z,
            );
            camera.lookAt(drone.position);
          }

          // UI altitude
          document.getElementById("depth").innerText =
            (drone.position.y + 2100).toFixed(0) + " m";
        }

        // AUDIO
        if (audioCtx && phaserFilter) {
          const speed = velocity.length();
          phaserFilter.frequency.setTargetAtTime(
            520 + Math.sin(time) * 120 + speed * 1100,
            audioCtx.currentTime,
            0.1,
          );
          engineOsc.frequency.setTargetAtTime(
            38 + speed * 90,
            audioCtx.currentTime,
            0.1,
          );
          engineGain.gain.setTargetAtTime(
            0.08 + speed * 0.22,
            audioCtx.currentTime,
            0.1,
          );

          if (isHumanView) {
            const relativeX = drone.position.x - humanAnchorXZ.x;
            const panVal = clamp(relativeX / 140, -1, 1);
            panner.pan.setTargetAtTime(panVal, audioCtx.currentTime, 0.1);
          } else {
            panner.pan.setTargetAtTime(
              Math.sin(rotationY) * 0.35,
              audioCtx.currentTime,
              0.1,
            );
          }
        }

        renderer.render(scene, camera);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
