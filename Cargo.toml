[workspace]

[package]
name = "cosmic_systems"
version = "0.1.0"
edition = "2021"
default-run = "cosmic_systems"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bevy = { version = "0.17.3" }
glam = "0.30.10"
pulldown-cmark = "0.13"
rand = "0.8.5"
bytemuck = "1.14"       # Safe casting between byte slices and types
serde = { version = "1.0", features = ["derive"] }  # Serialization for Web Workers
ron = "0.10"            # Rocket vehicle configuration files (assets/configs/rockets)
async-trait = "0.1"     # Async trait definitions
anise = { version = "=0.10.6", default-features = false } # Offline SPICE/DE ephemeris evaluation
sha2 = "0.10"           # Kernel manifest checksum validation
tokio = { version = "1.0", features = ["rt", "macros", "io-util", "time"] }  # Async runtime (wasm-compatible features)
bevy_mesh = "0.17.3"
bevy_asset = "0.17.3"

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Performance", "Url", "Window", "Worker", "console"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication
futures-channel = "0.3"

[features]
default = ["native"]
native = ["dem"]
dem = []

[[bin]]
name = "etopo1_convert"
path = "src/bin/etopo1_convert.rs"
required-features = ["dem"]
