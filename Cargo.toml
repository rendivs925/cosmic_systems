[workspace]

[package]
name = "cosmic_systems"
version = "0.1.8"
edition = "2021"
default-run = "cosmic_systems"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
# Bevy's defaults minus the GameActivity backend, plus NativeActivity: the
# Terminal/Termux on-device APK pipeline (`cargo-apk2`) packages a NativeActivity
# manifest, and Bevy's native-activity glue needs no Java or C++ shim.
bevy = { version = "0.17.3", default-features = false, features = [
    "std",
    "async_executor",
    "android_shared_stdcxx",
    "android-native-activity",
    "animation",
    "bevy_asset",
    "bevy_audio",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_post_process",
    "bevy_anti_alias",
    "bevy_gizmos",
    "bevy_gltf",
    "bevy_input_focus",
    "bevy_log",
    "bevy_mesh_picking_backend",
    "bevy_pbr",
    "bevy_picking",
    "bevy_render",
    "bevy_scene",
    "bevy_image",
    "bevy_mesh",
    "bevy_camera",
    "bevy_light",
    "bevy_shader",
    "bevy_sprite",
    "bevy_sprite_picking_backend",
    "bevy_sprite_render",
    "bevy_state",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_picking_backend",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "custom_cursor",
    "default_font",
    "hdr",
    "multi_threaded",
    "png",
    "reflect_auto_register",
    "smaa_luts",
    "tonemapping_luts",
    "vorbis",
    "webgl2",
    "zstd_rust",
    "x11",
    "wayland",
    "debug",
] }
glam = "0.30.10"
pulldown-cmark = "0.13"
rand = "0.8.5"
bytemuck = "1.14"       # Safe casting between byte slices and types
serde = { version = "1.0", features = ["derive"] }  # Serialization for Web Workers
ron = "0.10"            # Rocket vehicle configuration files (assets/configs/rockets)
async-trait = "0.1"     # Async trait definitions
anise = { version = "=0.10.6", default-features = false } # Offline SPICE/DE ephemeris evaluation
sha2 = "0.10"           # Kernel manifest checksum validation
tokio = { version = "1.0", features = ["rt", "macros", "io-util", "time"] }  # Async runtime (wasm-compatible features)
bevy_mesh = "0.17.3"
bevy_asset = "0.17.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11"            # Signed i16 GeoTIFF decoding for regional DEM ingest

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Performance", "Url", "Window", "Worker", "console"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication
futures-channel = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
bevy_android = "0.17.3"  # AndroidApp handle / AssetManager staging
jni = "0.21"             # MediaStore startup log (Android hides other apps' logcat)
ndk = "0.9"              # AAssetManager access for staged shipped data

[profile.dev]
# `cargo run` must stay usable: the simulator is CPU-heavy even before the
# renderer, and an unoptimized build makes it unplayable. Optimize this crate
# lightly so fast rebuilds remain useful.
opt-level = 1
# Line tables only. Full DWARF made a single debug binary 1.78 GB, of which
# 1.60 GB was debug info: every link wrote ~1.7 GB and `target/` reached 96 GB.
# Line tables keep file:line backtraces for this crate at a fraction of it.
debug = 1

[profile.dev.package."*"]
# Dependencies (Bevy, physics math, image decoding) have no debugger value
# here; optimize them fully so `cargo run` performance approaches release, and
# emit no DWARF at all — they are what made the artifacts enormous.
opt-level = 3
debug = 0

[features]
default = ["native"]
native = ["dem"]
dem = []

# Android packaging metadata for `cargo-apk2` (Termux on-device builds).
# See docs/android.md for the toolchain setup.
[package.metadata.android]
package = "com.rendivs925.cosmicsystems"
apk_name = "cosmic_systems"
assets = "assets-android"
build_targets = ["aarch64-linux-android"]
use_aapt2 = true
# oboe/cpal link the C++ runtime on Android; cargo-apk2 copies the NDK's
# libc++_shared.so into the APK when this is enabled.
include_cplusplus_shared = true
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "Cosmic Systems"

# NativeActivity needs no Java: the framework activity loads the cdylib named in
# the meta-data and calls its `ANativeActivity_onCreate` (provided by
# android-activity through `#[bevy_main]`).
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
exported = true

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "cosmic_systems_wasm"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

