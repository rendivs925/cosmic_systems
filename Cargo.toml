[workspace]

[package]
name = "cosmic_systems"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bevy = { version = "0.17.3" }
pulldown-cmark = "0.13"
rand = "0.8.5"
bumpalo = "3.14"        # Arena-based memory allocation
bytemuck = "1.14"       # Safe casting between byte slices and types
num_cpus = "1.16"       # CPU core detection
serde = { version = "1.0", features = ["derive"] }  # Serialization for Web Workers
async-trait = "0.1"     # Async trait definitions
tokio = { version = "1.0", features = ["rt", "macros", "io-util", "time"] }  # Async runtime (wasm-compatible features)
wgpu = "0.20"           # WebGPU for WASM compute
bevy_mesh = "0.17.3"
wgpu-types = "28.0.0"
bevy_asset = "0.17.3"

# DEM terrain data dependencies (optional, behind 'dem' feature)
geotiff = { version = "0.1", optional = true }
proj = { version = "0.31", optional = true }
srtm_reader = { version = "0.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"            # System calls for CPU affinity

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"          # macOS system frameworks
objc = "0.2.7"          # Objective-C runtime bindings

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi"] }  # Windows thread affinity

# Vulkan dependencies - only include if libloading is available
[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
ash = { version = "0.37", optional = true }  # Vulkan bindings for native compute
gpu-allocator = { version = "0.25", optional = true }  # Vulkan memory allocator

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Performance", "Url", "Window", "Worker", "console"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication
futures-channel = "0.3"

[dependencies.rayon]
version = "1.8"
optional = true             # Optional for parallel processing

[features]
default = ["native"]
native = ["ash"]            # Enable native binary build with Vulkan GPU acceleration
simd = []                   # Enable SIMD optimizations
parallel = ["rayon"]        # Enable parallel processing
dem = ["geotiff", "proj", "srtm_reader"]  # Real planetary DEM data

[dev-dependencies]
trunk = "0.18"
