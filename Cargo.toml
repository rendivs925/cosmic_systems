[workspace]

[package]
name = "cosmic_systems"
version = "0.1.0"
edition = "2021"
default-run = "cosmic_systems"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bevy = { version = "0.17.3" }
glam = "0.30.10"
pulldown-cmark = "0.13"
rand = "0.8.5"
bytemuck = "1.14"       # Safe casting between byte slices and types
serde = { version = "1.0", features = ["derive"] }  # Serialization for Web Workers
ron = "0.10"            # Rocket vehicle configuration files (assets/configs/rockets)
async-trait = "0.1"     # Async trait definitions
anise = { version = "=0.10.6", default-features = false } # Offline SPICE/DE ephemeris evaluation
sha2 = "0.10"           # Kernel manifest checksum validation
tokio = { version = "1.0", features = ["rt", "macros", "io-util", "time"] }  # Async runtime (wasm-compatible features)
bevy_mesh = "0.17.3"
bevy_asset = "0.17.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
tiff = "0.11"            # Signed i16 GeoTIFF decoding for regional DEM ingest

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Performance", "Url", "Window", "Worker", "console"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication
futures-channel = "0.3"

[profile.dev]
# `cargo run` must stay usable: the simulator is CPU-heavy even before the
# renderer, and an unoptimized build makes it unplayable. Optimize this crate
# lightly so debug info and fast rebuilds remain useful.
opt-level = 1

[profile.dev.package."*"]
# Dependencies (Bevy, physics math, image decoding) have no debugger value
# here; optimize them fully so `cargo run` performance approaches release.
opt-level = 3

[features]
default = ["native"]
native = ["dem"]
dem = []

[[bin]]
name = "etopo1_convert"
path = "src/bin/etopo1_convert.rs"
required-features = ["dem"]

[[bin]]
name = "etopo2022_convert"
path = "src/bin/etopo2022_convert.rs"
required-features = ["dem"]

[[bin]]
name = "csdem_upgrade"
path = "src/bin/csdem_upgrade.rs"
required-features = ["dem"]

[[bin]]
name = "elevation_pyramid_convert"
path = "src/bin/elevation_pyramid_convert.rs"
required-features = ["dem"]

[[bin]]
name = "terrain_overview_bake"
path = "src/bin/terrain_overview_bake.rs"
required-features = ["dem"]

[[bin]]
name = "terrain_site_delta"
path = "src/bin/terrain_site_delta.rs"
required-features = ["dem"]

[[bin]]
name = "regional_dem_bake"
path = "src/bin/regional_dem_bake.rs"
required-features = ["dem"]

[[bin]]
name = "erosion_bake"
path = "src/bin/erosion_bake.rs"
required-features = ["dem"]

[[bin]]
name = "lola_ldem_convert"
path = "src/bin/lola_ldem_convert.rs"
required-features = ["dem"]

[[bin]]
name = "mola_megr_convert"
path = "src/bin/mola_megr_convert.rs"
required-features = ["dem"]

[[bin]]
name = "preprocess"
path = "src/bin/preprocess.rs"
required-features = ["dem"]

[[bin]]
