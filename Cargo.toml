[package]
name = "cosmic_systems"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bevy = { version = "0.14.0" }
rand = "0.8.5"
bumpalo = "3.14"        # Arena-based memory allocation

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console", "Document", "Element", "Window"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication

[dependencies.rayon]
version = "1.8"
optional = true             # Optional for parallel processing

[features]
default = ["native"]
native = []                 # Enable native binary build
simd = []                   # Enable SIMD optimizations
parallel = ["rayon"]        # Enable parallel processing

[dev-dependencies]
trunk = "0.18"
