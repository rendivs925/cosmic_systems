[package]
name = "cosmic_systems"
version = "0.1.0"
edition = "2021"

[lib]
name = "cosmic_systems_wasm"
crate-type = ["cdylib"]

[[bin]]
name = "cosmic_systems"
path = "src/main.rs"
required-features = ["native"]

[dependencies]
bevy = { version = "0.14.0" }
rand = "0.8.5"
bumpalo = "3.14"        # Arena-based memory allocation
bytemuck = "1.14"       # Safe casting between byte slices and types
num_cpus = "1.16"       # CPU core detection
serde = { version = "1.0", features = ["derive"] }  # Serialization for Web Workers
wgpu = "0.19"           # WebGPU for WASM compute

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"            # System calls for CPU affinity

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"          # macOS system frameworks
objc = "0.2.7"          # Objective-C runtime bindings

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi"] }  # Windows thread affinity

# Vulkan dependencies - only include if libloading is available
[target.'cfg(all(not(target_arch = "wasm32"), any(unix, windows)))'.dependencies]
ash = { version = "0.37", optional = true }  # Vulkan bindings for native compute
gpu-allocator = { version = "0.25", optional = true }  # Vulkan memory allocator

[target.'cfg(all(target_family = "wasm", any(target_os = "unknown", target_os = "none")))'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1.0"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { version = "0.2", features = ["js"], package = "getrandom" }
js-sys = "0.3"
log = "0.4"
uuid = { version = "1.19", features = ["js"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "DedicatedWorkerGlobalScope", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap", "ImageData", "Location", "MessageEvent", "Navigator", "Url", "Window", "Worker", "console"] }
serde-wasm-bindgen = "0.6"  # Web Worker communication

[dependencies.rayon]
version = "1.8"
optional = true             # Optional for parallel processing

[features]
default = ["native"]
native = []                 # Enable native binary build
simd = []                   # Enable SIMD optimizations
parallel = ["rayon"]        # Enable parallel processing

[dev-dependencies]
trunk = "0.18"
