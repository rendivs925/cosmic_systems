<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cosmic Systems Simulator</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #bevy {
            width: 100%;
            height: 100%;
            display: block;
            position: fixed;
            inset: 0;
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            text-align: center;
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #333;
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
</style>
    <link data-trunk rel="copy-dir" href="assets">
</head>
<body>
    <link data-trunk rel="rust" data-target-name="cosmic_systems_wasm" />
    <div class="loading">Loading Cosmic Systems Simulator...</div>
    <canvas id="bevy"></canvas>
</body>
</html>
